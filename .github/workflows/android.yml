name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить зависимости
        run: npm ci

      - name: Собрать веб-часть
        run: npm run build

      - name: Перенести содержимое в android-проект
        run: npx cap sync android

      - name: Собрать APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -e
          chmod +x android/gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            (cd android && ./gradlew --no-daemon assembleRelease)
            echo "apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)" >> "$GITHUB_OUTPUT"
          else
            echo "Ключ подписи не настроен, собираю отладочный APK."
            (cd android && ./gradlew --no-daemon assembleDebug)
            echo "apk=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Переименовать в igraem.apk
        run: cp "${{ steps.build.outputs.apk }}" igraem.apk

      - uses: actions/upload-artifact@v4
        with:
          name: igraem-apk
          path: igraem.apk

      - name: Выложить релиз
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" igraem.apk \
            --title "Играем! 1.0.${{ github.run_number }}" \
            --notes "Свежая сборка. Скачай igraem.apk на телефон и открой файл, чтобы установить."
